name: Stock Analysis Bot

on:
  # 외부 크론(cron-job.org)에서 신호를 보낼 때 실행되는 트리거
  repository_dispatch:
    types: [stock-check]
    
  # 깃허브 웹사이트에서 수동으로 버튼 눌러 실행하고 싶을 때 사용
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run analysis
        env:
          # 깃허브 Settings > Secrets and variables > Actions에 등록된 키값들
          WEBHOOK_QQQ: ${{ secrets.WEBHOOK_QQQ }}
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
          WEBHOOK_RSI: ${{ secrets.WEBHOOK_RSI }}
        run: python main.py
