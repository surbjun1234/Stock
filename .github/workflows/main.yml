name: Stock Bot Run

on:
  schedule:
    - cron: '*/10 13-20 * * 1-5'  # 평일 미국장 시간 (한국시간 밤 10시~새벽 5시) 10분마다
  workflow_dispatch:              # 수동 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 중요: 봇이 파일을 쓰고 저장할 수 있도록 권한 부여
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests

      - name: Run Trading Bot
        env:
          WEBHOOK_QQQ: ${{ secrets.WEBHOOK_QQQ }}
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
          WEBHOOK_RSI: ${{ secrets.WEBHOOK_RSI }}
        run: |
          python main.py

      # ▼▼▼ [핵심: 상태 파일 저장 단계] ▼▼▼
      - name: Commit and Push state files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 변경된 상태 파일이 있으면 git에 추가
          git add scanner_state.json qqq_alert_state.txt last_daily_briefing.txt || true
          
          # 커밋하고 푸시 (내용이 바뀐게 없으면 에러 안나게 처리)
          git commit -m "Update bot state [skip ci]" || echo "No changes to commit"
          git push
