name: Stock Bot Run

on:
  schedule:
    - cron: '*/10 13-20 * * 1-5'  # 평일 한국시간 밤 10시 ~ 새벽 5시 (미국장 개장 시간 집중)
  workflow_dispatch:              # 수동 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # ★ 파일 저장을 위한 권한 설정 (필수)
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          WEBHOOK_QQQ: ${{ secrets.WEBHOOK_QQQ }}
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
          WEBHOOK_RSI: ${{ secrets.WEBHOOK_RSI }}
        run: |
          python main.py

      # ★ 봇의 기억(파일)을 깃허브에 저장하는 단계
      - name: Commit and Push state files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 상태 파일들 추가
          git add scanner_state.json qqq_alert_state.txt last_daily_briefing.txt || true
          
          # 변경사항이 있으면 커밋 및 푸시
          git commit -m "Update bot state [skip ci]" || echo "No changes to commit"
          git push
