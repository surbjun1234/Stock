name: QQQ Strategy Notifier

on:
  schedule:
    - cron: '0 14 * * *' # 한국 시간 23:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run analysis
        env:
          # 두 개의 Secret을 모두 환경변수로 등록
          WEBHOOK_QQQ: ${{ secrets.WEBHOOK_QQQ }}
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
        run: python main.py
