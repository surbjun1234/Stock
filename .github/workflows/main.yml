name: Stock Analysis Bot

on:
  schedule:
    # 한국 시간 오후 11:00 (UTC 14:00)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run analysis
        env:
          # 1. QQQ 매일 현황용
          WEBHOOK_QQQ: ${{ secrets.WEBHOOK_QQQ }}
          # 2. TQQQ 매수 신호용
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
          # 3. 우량주 스캐너용 (새로 추가)
          WEBHOOK_RSI: ${{ secrets.WEBHOOK_RSI }}
        run: python main.py
