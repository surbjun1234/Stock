name: Stock Analysis Bot

on:
  # 외부(cron-job.org)에서 보내는 신호 받기
  repository_dispatch:
    types: [stock-check]
    
  # 수동 실행 버튼
  workflow_dispatch:

# ★★★ 중요: 파일 쓰기(Commit) 권한 부여 ★★★
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run analysis
        env:
          WEBHOOK_QQQ: ${{ secrets.WEBHOOK_QQQ }}
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
          WEBHOOK_RSI: ${{ secrets.WEBHOOK_RSI }}
        run: python main.py

      # ★★★ 상태 파일 변경 시 저장(Commit & Push) ★★★
      - name: Commit state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Stock Bot"
          # 모든 txt 파일(상태 저장용)을 스테이징
          git add *.txt
          # 변경사항이 있을 때만 커밋하고 푸시
          git commit -m "Update bot status [skip ci]" || echo "No changes to commit"
          git push
