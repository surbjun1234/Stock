name: QQQ Strategy Notifier

on:
  schedule:
    # 한국 시간(KST) 23:00 -> UTC 14:00 (14시 + 9시간 = 23시)
    - cron: '0 14 * * *'
  workflow_dispatch: # 버튼을 눌러서 수동으로 즉시 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # yfinance 최신 문법 호환을 위해 3.10 이상 사용

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run analysis
        env:
          # 매수 신호 발생 시 메시지를 보낼 전용 웹훅 주소
          WEBHOOK_SIGNAL: ${{ secrets.WEBHOOK_SIGNAL }}
        run: python main.py
